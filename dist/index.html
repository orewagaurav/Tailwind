<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Dashboard - Tailwind CSS</title>
    <!-- <link rel="stylesheet" href="output.css"> -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-xl p-6 max-w-md w-full">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">Inventory Tracker</h1>
        <form class="space-y-4">
            <div>
                <label for="product" class="block text-sm font-medium text-gray-700">Product Name</label>
                <input type="text" id="product" placeholder="Enter product name" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="quantity" class="block text-sm font-medium text-gray-700">Quantity</label>
                <input type="number" id="quantity" placeholder="Enter quantity" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition duration-200">Add Product</button>
        </form>
        <div class="mt-6">
            <h2 class="text-lg font-semibold text-gray-800">Current Inventory</h2>
            <ul class="mt-2 space-y-2">
                <li class="flex justify-between text-gray-600">
                    <span>Laptop</span>
                    <span>10</span>
                </li>
                <li class="flex justify-between text-gray-600">
                    <span>Mouse</span>
                    <span>20</span>
                </li>
                <li class="flex justify-between text-gray-600">
                    <span>Keyboard</span>
                    <span>15</span>
                </li>
                <li class="flex justify-between text-gray-600">
                    <span>Monitor</span>
                    <span>5</span>
                </li>
                <li class="flex justify-between text-gray-600">
                    <span>USB Cable</span>
                    <span>25</span>
                </li>
                <li class="flex justify-between text-gray-600">
                    <span>Headphones</span>
                    <span>12</span>
                </li>
                <li class="flex justify-between text-gray-600">
                    <span>Webcam</span>
                    <span>8</span>
                </li>
            </ul>   
        </div>
    </div>
</body>
